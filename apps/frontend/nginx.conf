server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ===== 阿里云 CDN/DCDN 真实客户端 IP（配置见该文件内注释）=====
  include /etc/nginx/cdn-realip.conf;

  # ===== 防 CDN 绕过直连源站伪造 IP =====
  # 在阿里云控制台「域名管理 → 回源配置 → 自定义 HTTP 回源头」添加
  # X-Origin-Token: <与 compose 环境变量 ORIGIN_TOKEN 同值>，不匹配即 403。
  # ORIGIN_TOKEN 留空 = 不校验（本地/未套 CDN 直连部署不受影响）。
  if ($http_x_origin_token != "${ORIGIN_TOKEN}") {
    return 403;
  }

  # 学生上传材料包上限 100MB，留余量（阿里云 DCDN 单文件上传上限 300MB，不受限）
  client_max_body_size 110m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 入口 HTML 不缓存：CDN 若缓存旧 index.html，发版后会指向已删除的 hash 资源 → 白屏
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 带 hash 的静态资源：长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # /api 反代到 backend 容器（Node 流式下发文件，无需 X-Accel）
  location /api/ {
    add_header Cache-Control "no-store" always;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写为单一真实客户端 IP（realip 处理后的 $remote_addr）：
    # 后端按 XFF 首段取 IP（common/decorators ClientIp），客户端伪造的 XFF 链在此被丢弃
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off; # 文件流式下载不落盘缓冲
  }

  # SPA 路由回退（fallback 经内部重定向命中 = /index.html，同样 no-cache）
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
