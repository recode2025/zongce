# 阿里云 CDN / 全站加速 DCDN → 源站真实客户端 IP
#
# 原理：CDN 回源时透传 ali-cdn-real-ip 请求头（值为客户端真实 IP）；
# nginx realip 模块仅当连接来源命中 set_real_ip_from 网段时才信任该头，
# 处理后 $remote_addr 即为真实客户端 IP（上方 X-Origin-Token 校验防直连伪造）。
#
# 0.0.0.0/0 = 信任所有来源，安全性依赖 X-Origin-Token 校验或安全组只放行回源网段。
# 建议上线后从控制台下载精确回源网段替换，双重防护：
#   CDN:  控制台「工具 → 获取CDN回源节点IP地址」
#         https://help.aliyun.com/zh/cdn/user-guide/query-ip-addresses-of-pops-for-a-cdn-domain
#   DCDN: https://help.aliyun.com/zh/dcdn/user-guide/query-the-ip-addresses-of-pop-nodes
# 替换示例（删除 0.0.0.0/0 那行，换成实际网段，一行一段）：
#   set_real_ip_from 203.0.113.0/24;
#   set_real_ip_from 198.51.100.0/24;
#
# 若回源未携带 ali-cdn-real-ip（个别配置），可改用 XFF 递归剥离：
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;   # 需精确网段列表才能正确剥离 CDN 节点 IP
set_real_ip_from 0.0.0.0/0;
real_ip_header Ali-Cdn-Real-Ip;
real_ip_recursive off;
