name: zongce

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: zongce
      MYSQL_USER: zc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 如需外部直连再暴露端口
    # ports: ["3306:3306"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AI 调用额度依赖 Redis 持久化；每次写入后同步 AOF，避免故障回滚已消耗额度。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://zc:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/zongce?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      AES_KEY_HEX: ${AES_KEY_HEX:?Set AES_KEY_HEX in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      TRUST_PROXY: 'true' # backend 仅暴露在 Compose 网络内，由 nginx 覆写转发头
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the frontend origin in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_DAILY_USER_LIMIT: ${AI_DAILY_USER_LIMIT:-10}
      AI_DAILY_GLOBAL_LIMIT: ${AI_DAILY_GLOBAL_LIMIT:-1000}
      AI_CONCURRENT_LIMIT: ${AI_CONCURRENT_LIMIT:-5}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端容器（React SPA + nginx 反代）。前端落地前不参与默认启停：
  # docker compose up -d                      → 只起 mysql/redis/backend
  # docker compose --profile frontend up -d   → 前端就绪后一并启动
  frontend:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # 阿里云 CDN 回源校验 token（与控制台「回源自定义头 X-Origin-Token」同值；留空 = 不校验）
      ORIGIN_TOKEN: ${ORIGIN_TOKEN:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  uploads:
